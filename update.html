<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Updating System...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background: #0f172a; color: white; margin: 0; }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 4px solid #10b981; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>กำลังอัปเดตระบบเป็นเวอร์ชันใหม่...</h2>
    <p>กำลังล้างแคชเก่า กรุณารอสักครู่</p>

    <script>
        localStorage.clear();
        sessionStorage.clear();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                let promises = [];
                for(let registration of registrations) {
                    promises.push(registration.unregister());
                }
                return Promise.all(promises);
            }).then(() => {
                if ('caches' in window) {
                    return caches.keys().then(function(names) {
                        return Promise.all(names.map(name => caches.delete(name)));
                    });
                }
            }).then(() => {
                setTimeout(() => {
                    window.location.replace('/?v=' + Date.now());
                }, 1000);
            }).catch(() => {
                window.location.replace('/?v=' + Date.now());
            });
        } else {
            window.location.replace('/?v=' + Date.now());
        }
    </script>
</body>
</html>
